---
# Post-build OS hardening playbook
# Applies CIS Level 1/2 controls via mgcdrd.infrabase roles.
# Run once after provisioning, before handing off to service deployments.
#
# Usage:
#   ansible-galaxy collection install -r collections/requirements.yml
#   ansible-playbook site.yml
#
# Role execution order:
#   storage   — grow OS partition/PV/LV if the underlying disk was resized
#   guest     — qemu-guest-agent (VM/Proxmox integration, not a CIS control;
#               skipped on proxmox_ve and misc since those aren't QEMU guests,
#               and self-skips inside a container)
#   kernel    — module blacklist, sysctl, mount hardening, coredump
#   access    — banner, sshd, password policy, pam, sudo, cron
#   services  — disable unused services, host firewall
#   mail      — postfix, client mode (cron/alert mail out to a relay)
#   logging   — journald, rsyslog, auditd
#   integrity — aide (last: DB captures final hardened state)
#
# Container targets (Proxmox LXC etc.): the storage play sets
# harden_container_guest from virt facts, and the sysctl / secure_mounts /
# firewall / auditd roles are skipped when it is true — those need namespaced
# kernel, netfilter, or audit access the container doesn't have; hardening them
# is the host's job. Each has its own harden_container_skip_<role> toggle
# (defaults to harden_container_guest) — override one in host_vars to run that
# role on a container that supports it, e.g. firewalld in a privileged LXC.
# Everything else in this playbook runs unchanged in a container.

- name: Harden - Storage (OS partition/LV expansion)
  # VM templates are built with a small root disk; growing it later
  # (ProxMox) doesn't extend the guest's partition/PV/VG/LV on its own.
  # Opt-in per host via lvm_pv_grow/lvm_volumes in inventory/host_vars —
  # both default to [] (no-op) so this is safe on hosts that need nothing.
  # Runs first so later phases see the host at its final size.
  hosts: all
  become: true
  gather_facts: true
  pre_tasks:
    - name: Harden - Detect container guest
      # Set once here (first play, facts already gathered) and read by the
      # kernel-facing roles in later plays via the harden_container_skip_<role>
      # vars in group_vars. set_fact stores a real bool and is not cacheable,
      # so it is recomputed every run regardless of the shared fact cache.
      # tags: always so a --tags run still gets the detection.
      ansible.builtin.set_fact:
        harden_container_guest: "{{ (ansible_facts['virtualization_role'] | default('host')) == 'guest'
          and ansible_facts['virtualization_type'] | default('') in _harden_container_virt_types }}"
      vars:
        _harden_container_virt_types: [lxc, systemd-nspawn, docker, podman, container, openvz]
      tags: always
  roles:
    - mgcdrd.infrabase.lvm2


- name: Harden - Proxmox guest agent
  # Not a CIS control — every QEMU/Proxmox VM guest should run
  # qemu-guest-agent regardless of hardening level. Excludes proxmox_ve
  # (hypervisor nodes) and misc (rpiblade bare metal) since neither is a
  # QEMU guest.
  hosts: all:!proxmox_ve:!misc
  become: true
  gather_facts: true
  roles:
    - mgcdrd.infrabase.qemu_guest_agent


- name: Harden - Kernel and filesystem hardening
  hosts: all
  become: true
  gather_facts: true
  roles:
    - mgcdrd.infrabase.kernel_modules
    - role: mgcdrd.infrabase.sysctl
      when: not (harden_container_skip_sysctl | bool)
    - role: mgcdrd.infrabase.secure_mounts
      when: not (harden_container_skip_secure_mounts | bool)
    - mgcdrd.infrabase.coredump


- name: Harden - Access control hardening
  hosts: all
  become: true
  gather_facts: true
  roles:
    - mgcdrd.infrabase.login_banner
    - mgcdrd.infrabase.sshd
    - mgcdrd.infrabase.password_policy
    - mgcdrd.infrabase.pam
    - mgcdrd.infrabase.sudoers
    - mgcdrd.infrabase.cron


- name: Harden - Service hardening
  hosts: all
  become: true
  gather_facts: true
  roles:
    - mgcdrd.infrabase.hardened_services
    - role: mgcdrd.infrabase.firewall
      when: not (harden_container_skip_firewall | bool)
    - mgcdrd.infrabase.crypto_policies


- name: Harden - Mail relay client
  # Every host gets postfix in client mode so local/cron/alert mail has
  # somewhere to go. postfix_relayhost is unset until a relay target
  # (internal host or external SMTP service) is decided — see the
  # postfix section in inventory/group_vars/all/main.yml.
  hosts: all
  become: true
  gather_facts: true
  roles:
    - mgcdrd.infrabase.postfix


- name: Harden - Logging and auditing
  hosts: all
  become: true
  gather_facts: true
  roles:
    - mgcdrd.infrabase.journald
    - mgcdrd.infrabase.rsyslog
    - role: mgcdrd.infrabase.auditd
      when: not (harden_container_skip_auditd | bool)


- name: Harden - File integrity monitoring
  hosts: all
  become: true
  gather_facts: true
  roles:
    - mgcdrd.infrabase.aide
